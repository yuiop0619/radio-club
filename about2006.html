/* ---------- 渲染单章的 win ---------- */
function renderChapter(c, idx, total) {
  var H = RC.i18n.lang() === 'jp' ? 1 : 0;   /* 1=jp：供内联三元与 c.jp/c.cn 使用 */
  /* 章节正文数据数组约定为 [日文, 中文]，下标与 H 相反 */
  function pick(arr) { var i = 1 - H; return arr[i] != null ? arr[i] : arr[0]; }
  var prev = idx > 1 ? '<a class="dyn-link goPrev">' + (H === 1 ? '← 前章' : '← 上一章') + '</a>' : '<a class="dyn-link disabled">← ' + (H === 1 ? '前章' : '上一章') + '</a>';
  var next = idx < total ? '<a class="dyn-link goNext">' + (H === 1 ? '次章 →' : '下一章 →') + '</a>' : '<a class="dyn-link disabled">' + (H === 1 ? '次章 →' : '下一章 →') + '</a>';
  var navLine = '<p style="text-align:center;font-size:12px;margin:8px 0 4px;">' + prev +
    ' ┃ <span class="here" style="color:#000080;">第 ' + idx + ' / ' + total + ' 章</span> ┃ ' + next + '</p>';

  var sub = c.sub ? '<p class="center"><b>' + pick(c.sub) + '</b></p>' : '';
  var lede = c.lede ? '<p>' + pick(c.lede) + '</p>' : '';

  var whatsnewHtml = '<ul style="padding-left:22px;font-size:12px;">' +
    c.whatsnew.map(function (row) { return '<li>' + pick(row) + '</li>'; }).join('') + '</ul>';

  var masterBlock = '';
  if (c.master1) {
    masterBlock = '<h2>' + (H === 1 ? '管理人より' : '管理人的话') + '</h2>' +
      '<p>' + pick(c.master1) + '</p>' +
      '<p>' + pick(c.master2) + '</p>' +
      '<p>' + pick(c.master3) + '</p>';
  }

  var guestsHtml = c.guests.map(function (row) { return '<div class="row">' + pick(row) + '</div>'; }).join('');
  var webring = c.webring
    ? '<hr><h2>' + (H === 1 ? '参加中のリンク集' : '参与中的链接集') + '</h2>' +
      '<div class="webring">← <a class="dyn-link goPrev">' + (H === 1 ? '前' : '前') + '</a> ┃ ' +
      '<a href="#">' + (H === 1 ? 'Personal Homepage WebRing' : 'Personal Homepage WebRing') + '</a> ┃ ' +
      '<a href="#">' + (H === 1 ? '深夜サイト同盟' : '深夜网站同盟') + '</a> ┃ ' +
      '<a href="#">' + (H === 1 ? '同人 Web デザイン集会' : '同人 Web 设计集会') + '</a> ┃ ' +
      '<a class="dyn-link goNext">' + (H === 1 ? '次' : '次') + '</a> →</div>'
    : '';

  var coda = c.coda ? '<p style="text-align:right;font-size:12px;"><b>' + pick(c.coda) + '</b></p>' : '';

  return '<div class="win" role="complementary" aria-label="RADIO CLUB 2006 ' + c.en + '">' +
    '<div class="win-title">' +
      '<span class="dot"></span>' +
      '<span class="name">' + c.winName +
        '<button type="button" class="lang2006" id="langBtn_' + c.id + '" title="切换为日文版（原作致敬）｜日本語版に切替">中 ／ JP</button>' +
      '</span>' +
      '<span class="btns"><span>_</span><span>□</span><span>×</span></span>' +
    '</div>' +
    '<div class="win-menu">' +
      '<a href="#" style="color:inherit;"><span><u>フ</u>ァイル(F)</span></a>' +
      '<a href="#" style="color:inherit;"><span><u>編</u>集(E)</span></a>' +
      '<a href="#" style="color:inherit;"><span><u>表</u>示(V)</span></a>' +
      '<a href="#" style="color:inherit;"><span><u>お</u>気に入り(A)</span></a>' +
      '<a href="#" style="color:inherit;"><span><u>ツ</u>ール(T)</span></a>' +
      '<a href="#" style="color:inherit;"><span><u>ヘ</u>ルプ(H)</span></a>' +
    '</div>' +
    '<div class="win-bar">' +
      '<span style="color:#333;">アドレス(D):</span>' +
      '<input class="addr2006" value="http://www.radio-club.ne.jp/?ch=' + c.id + '" readonly>' +
      '<button onclick="return false;">→ ' + (H === 1 ? '移動' : '移动') + '</button>' +
    '</div>' +

    '<div class="win-body">' +
      '<h1>' + pick(c.heading) + '</h1>' +
      sub + lede +

      (c.img ? '<figure class="ch-fig"><img src="' + c.img + '" alt="' + pick(c.imgCap) + '">' +
        '<figcaption>' + pick(c.imgCap) + '</figcaption></figure>' : '') +

      '<p style="text-align:center;">' +
        '<img alt="[welcome]" src="assets/img/welcome-2006.svg" width="200" height="40" onerror="this.style.display=\'none\'">' +
      '</p>' +

      navLine +

      '<div class="center cout">来店カウンタ ━━ [<span style="color:#c00;font-weight:bold;">' +
        String(8421 + c.id * 113).padStart(8, '0') +
        '</span>] ━━ ' + (H === 1 ? '番目の常連さんへ。' : '位常客，这里请。') +
      '</div>' +

      '<h2>What\'s New</h2>' + whatsnewHtml +

      '<h2>' + (H === 1 ? 'リンクバナー' : '链接横幅') + '</h2>' +
      '<p style="text-align:center;">' +
        '<a href="#"><img alt="[in]" src="assets/img/banner88x31.svg" width="88" height="31" onerror="this.outerHTML=\'<span class=&quot;badge-old&quot;>88×31<br>BANNER</span>\'"></a>' +
        '<a href="#"><img alt="[88x31]" src="assets/img/banner88x31-2.svg" width="88" height="31" onerror="this.outerHTML=\'<span class=&quot;badge-old&quot;>88×31<br>BANNER</span>\'"></a>' +
      '</p>' +

      masterBlock +

      '<hr>' +
      '<h2>≪ ' + (H === 1 ? '最近の常連さんの声' : '最近的常客的声音') + ' ≫</h2>' +
      '<div class="guest-book">' + guestsHtml + '</div>' +

      webring +

      coda +

      navLine +

      '<p style="text-align:right;font-size:11px;">' +
        '<a href="index.html">→ ' + (H === 1 ? '今の RADIO CLUB（2026 同人版）' : '现在的 RADIO CLUB（2026 同人版）') + '</a>' +
      '</p>' +
    '</div>' +

    '<div class="win-status">' +
      '<span>' + (H === 1 ? '完了' : '完了') + '</span>' +
      '<span class="right">' + (H === 1 ? 'インターネット' : '互联网') + '</span>' +
    '</div>' +

    '<div class="foot-2006">' +
      '<span><a href="index.html">HOME</a> │ <a href="link.html">LINK</a> │ <a href="#top">↑PAGE TOP</a></span>' +
      '<span class="badge"><span class="badge-old">RADIO CLUB<br>BEST VIEWED 1024×768</span></span>' +
    '</div>' +

  '</div>';
}

var currentCh = 1;
function apply() {
  var H = RC.i18n.lang() === 'jp' ? 1 : 0;
  var root = document.getElementById('allChapters');
  root.innerHTML = CHAPTERS.map(function (c, i) {
    return '<div class="win-ch" data-ch="' + c.id + '" id="ch-' + c.id + '">' +
      renderChapter(c, c.id, CHAPTERS.length) + '</div>';
  }).join('');
  // 绑定每章内导航
  root.querySelectorAll('.goPrev').forEach(function (el) {
    el.addEventListener('click', function (e) { e.preventDefault(); go(currentCh - 1); });
  });
  root.querySelectorAll('.goNext').forEach(function (e2) {
    e2.addEventListener('click', function (e) { e.preventDefault(); go(currentCh + 1); });
  });
  // 绑定每章 lang 按钮
  root.querySelectorAll('[id^="langBtn_"]').forEach(function (b) {
    b.addEventListener('click', function () { RC.i18n.toggle(); });
  });
  show(currentCh);
  document.getElementById('chNow').textContent = currentCh;
  // 顶导标题
  var c = CHAPTERS[currentCh - 1];
  document.getElementById('chTitle').innerHTML = (H === 1 ? c.jp : c.cn);
  document.getElementById('chLoc').textContent = 'about2006.html?ch=' + currentCh;
  // 顶导 上下章 disabled 状态
  var prev = document.getElementById('chPrev');
  var next = document.getElementById('chNext');
  prev.classList.toggle('disabled', currentCh <= 1);
  next.classList.toggle('disabled', currentCh >= CHAPTERS.length);
  document.documentElement.scrollTop = 0;
  // 切换 → 重新应用 i18n（按钮文字也跟着切）
  if (window.RC && RC.i18n && RC.i18n.apply) RC.i18n.apply(document);
}

function show(n) {
  currentCh = Math.max(1, Math.min(CHAPTERS.length, n));
  var blocks = document.querySelectorAll('.win-ch');
  for (var i = 0; i < blocks.length; i++) blocks[i].classList.remove('on');
  var cur = document.getElementById('ch-' + currentCh);
  if (cur) cur.classList.add('on');
}
function go(n) {
  if (n < 1 || n > CHAPTERS.length) return;
  apply();   // 重渲染（语言相关的字串都要切）
  currentCh = n;
  show(n);
  if (history.replaceState) history.replaceState(null, '', '?ch=' + n);
  document.getElementById('chNow').textContent = n;
  var c = CHAPTERS[n - 1];
  var H = RC.i18n.lang() === 'jp' ? 1 : 0;
  document.getElementById('chTitle').innerHTML = (H === 1 ? c.jp : c.cn);
  document.getElementById('chLoc').textContent = 'about2006.html?ch=' + n;
  var prev = document.getElementById('chPrev');
  var next = document.getElementById('chNext');
  prev.classList.toggle('disabled', n <= 1);
  next.classList.toggle('disabled', n >= CHAPTERS.length);
  document.documentElement.scrollTop = 0;
}

function getQueryCh() {
  var m = location.search.match(/[?&]ch=(\d+)/);
  if (!m) return 1;
  var n = parseInt(m[1], 10);
  if (n < 1 || n > CHAPTERS.length) return 1;
  return n;
}

document.getElementById('chPrev').addEventListener('click', function (e) {
  e.preventDefault(); if (currentCh > 1) go(currentCh - 1);
});
document.getElementById('chNext').addEventListener('click', function (e) {
  e.preventDefault(); if (currentCh < CHAPTERS.length) go(currentCh + 1);
});

currentCh = getQueryCh();
apply();
RC.i18n.onChange(apply);
</script>
