<meta name="description" content="RADIO CLUB 同人站的 2006 年版封存。按《红辣椒》（パプリカ，2006）的情节推进分为 5 章节：网站开张、17 楼开放、梦境大游行、敦子的陷阱、结末。原样保留当年的 Win9x 假浏览器外壳，双线 GIF，与「BEST VIEWED 1024×768」徽章。">

/* 2006 同人版：刻意保留当年的笨拙 */
body{
  background:teal url("assets/img/bg2006.svg") repeat;
  font-family:"MS PGothic","MS Gothic","Hiragino Kaku Gothic ProN",sans-serif;
  color:#000;
  padding:24px 0;
}
.t2006{ width:760px;max-width:96vw;margin:0 auto; }
.win{
  background:#d4d0c8;border:2px solid #fff;outline:2px solid #808080;
  box-shadow:1px 1px 0 #000;
}
.win-title{
  background:linear-gradient(90deg,#000080,#1084d0);
  color:#fff;font-weight:bold;font-size:13px;padding:3px 6px;
  display:flex;align-items:center;gap:6px;
}
.win-title .dot{width:14px;height:14px;background:#c0c0c0;border:1px solid #fff;outline:1px solid #808080;display:inline-block;}
.win-title .name{flex:1;display:flex;align-items:center;gap:6px;}
.win-title .name .lang2006{
  background:#c0c0c0;color:#000;border:1px solid #fff;outline:1px solid #808080;
  font-size:11px;padding:0 6px;font-family:inherit;font-weight:normal;cursor:pointer;
  letter-spacing:.05em;
}
.win-title .name .lang2006:hover{ background:#fff; }
.win-title .btns{display:flex;gap:2px;}
.win-title .btns span{
  display:inline-block;width:18px;height:16px;background:#c0c0c0;color:#000;
  border:1px solid #fff;outline:1px solid #808080;font-size:11px;
  text-align:center;line-height:14px;font-weight:normal;
}
.win-menu{
  background:#d4d0c8;border-bottom:1px solid #808080;font-size:12px;
  padding:2px 4px;display:flex;gap:8px;
}
.win-menu u{text-decoration:underline;}
.win-bar{
  background:#d4d0c8;border-bottom:1px solid #808080;
  padding:3px 6px;display:flex;align-items:center;gap:5px;font-size:12px;
}
.win-bar input{
  flex:1;background:#fff;border:1px solid #808080;outline:1px solid #fff;
  font-family:"MS PGothic",monospace;font-size:12px;padding:1px 4px;
}
.win-bar button{
  background:#d4d0c8;border:1px solid #fff;outline:1px solid #808080;
  font-size:12px;padding:0 12px;font-family:inherit;
}
.win-status{
  background:#d4d0c8;border-top:1px solid #808080;
  padding:2px 6px;font-size:11px;display:flex;gap:14px;
}
.win-status .right{margin-left:auto;border:1px solid #808080;border-top:0;border-right:0;padding:0 6px;background:#d4d0c8;min-width:120px;}
.win-body{background:#fff;color:#000;padding:18px 22px;}
.win-body h1{
  font-size:18px;letter-spacing:.18em;color:#000080;
  border-bottom:2px solid #000080;padding-bottom:4px;margin-bottom:10px;
}
.win-body h2{
  font-size:14px;color:#000080;border-left:3px solid #000080;padding-left:6px;
  margin:14px 0 6px;
}
.win-body p{font-size:12px;line-height:1.85;margin:6px 0;}
.win-body hr{border:0;border-top:1px dotted #808080;margin:12px 0;}
.win-body a{color:#0000ee;}
.win-body a:visited{color:#800080;}
.blink-red{color:#c00;font-weight:bold;animation:blink 1s steps(2) infinite;}
@keyframes blink{to{visibility:hidden;}}
.guest-book{border:1px solid #808080;background:#f4f0e6;padding:8px 10px;font-size:11px;}
.guest-book .row{border-bottom:1px dotted #808080;padding:5px 0;}
.guest-book .row:nth-child(odd){background:#ece8d6;}
.cout{
  margin:6px 0 4px;font-size:14px;
  font-family:"MS PGothic",monospace;color:#006400;
}
.badge-old{
  display:inline-block;width:88px;height:31px;border:1px solid #000;
  background:linear-gradient(135deg,#f0e0a0,#d8c870);
  font-size:9px;color:#3a2c10;display:inline-flex;align-items:center;justify-content:center;
  text-align:center;letter-spacing:.05em;font-family:Arial,sans-serif;
}
.webring{font-size:11px;color:#333;border:1px dashed #808080;padding:6px 10px;margin:10px 0;}
.opt{
  display:inline-block;padding:1px 8px;border:1px solid #000080;color:#000080;
  font-size:11px;background:#fff;text-decoration:none;margin-right:6px;
}
.opt:visited{color:#800080;}

/* chapter switcher */
.win-ch{ display:none; }
.win-ch.on{ display:block; }
.ch-bar{
  margin:8px auto;max-width:760px;width:96vw;
  background:#d4d0c8;border:2px solid #fff;outline:2px solid #808080;
  padding:4px 10px;font-size:12px;color:#000;
  display:flex;align-items:center;gap:12px;justify-content:space-between;
}
.ch-bar .here{ color:#c00;font-weight:bold; }
.ch-bar a{ color:#0000ee;text-decoration:underline;cursor:pointer;user-select:none; }
.ch-bar a:visited{ color:#800080; }
.ch-bar a.disabled{ color:#888;text-decoration:none;cursor:not-allowed;pointer-events:none; }
.ch-bar .ch-loc{ font-family:"MS PGothic",monospace;font-size:11px;color:#333; }

/* 章节致敬插图 */
.ch-fig{ margin:10px auto 4px; text-align:center; }
.ch-fig img{ max-width:100%; border:1px solid #808080; outline:1px solid #fff; box-shadow:2px 2px 0 #808080; }
.ch-fig figcaption{ font-size:11px; color:#333; margin-top:4px; font-family:"MS PGothic",monospace; }

/* foot */
.foot-2006{
  background:#d4d0c8;border-top:1px solid #808080;padding:6px 10px;
  font-size:11px;color:#333;display:flex;gap:10px;flex-wrap:wrap;
}
.foot-2006 .badge{margin-left:auto;}
.dyn-link{ color:#0000ee;text-decoration:underline;cursor:pointer; }
.dyn-link.disabled{ color:#888;text-decoration:none;cursor:not-allowed;pointer-events:none; }
</style>
