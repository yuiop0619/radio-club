<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADIO CLUB｜留言板</title>
<link rel="stylesheet" href="assets/css/club.css">
</head>
<body data-amb-whisper>
<div id="app">

  <header class="site-head slim">
    <div class="slim-bar">
      <a class="logo-sm" href="index.html">RADIO <b>CLUB</b></a>
      <span class="logo-sub-sm">网络上的酒吧／梦侦探事务所</span>
      <span class="open-lamp-sm"><span class="lamp"></span>营业中</span>
    </div>
    <div id="navMount"></div>
  </header>

  <div class="wrap">

    <div class="panel">
      <div class="p-head"><h2>常客留言</h2><span class="p-en">BBS</span><span class="p-note">温柔一点。可以把牢骚留在这儿</span></div>
      <div class="p-body">
        <div id="posts"></div>
        <hr class="rule dbl">
        <div class="row">
          <div class="field">
            <label class="f">名字</label>
            <input type="text" id="pName" placeholder="匿名也行">
          </div>
          <div class="field" style="flex:2">
            <label class="f">说点什么</label>
            <input type="text" id="pBody" placeholder="今夜的感想、牢骚，或只是打个招呼">
          </div>
        </div>
        <div class="center"><button type="button" class="btn" id="btnPost">发布</button></div>
        <div class="hint center" id="postMsg"></div>
      </div>
    </div>

  </div>

  <footer class="site-foot">
    <span class="f-links"><a href="index.html">吧台</a> │ <a href="link.html">链接</a></span>
    <span class="copy">© 2006- RADIO CLUB ／ 网络上的酒吧</span>
  </footer>

</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/tarot-data.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/haunt.js"></script>
<script>
RC.ui.chrome({ title: '留言板', path: 'bbs.html' });
document.getElementById('navMount').innerHTML = RC.ui.nav('bbs.html');

var SEED = [
  { name: '雾岛岩夫', role: '店主', body: '今晚也照常营业。天冷，点热牛奶的孩子，我蜂蜜都多放了一勺。' },
  { name: '濑田涟', role: '酒保', body: '……嗯。（新来的客人，牌不用怕抽错。）' },
  { name: '常客·阿孝', role: '客', body: '上周在这儿被人听我把话讲完，终于跟上司开口了。谢谢。' },
  { name: '萨弗兰', role: '梦侦探', body: '鉴定书我放在吧台了，来取。读完，也请把你的反驳一起带来。' },
  { name: '常客·小绿', role: '客', body: '这儿的高球，气泡是真细。岩夫的手艺没退步。' }
];

function load() {
  var p = RC.store.get('bbs', null);
  if (!p) { p = SEED.slice(); RC.store.set('bbs', p); }
  return p;
}
function render() {
  var p = load();
  document.getElementById('posts').innerHTML = p.slice().reverse().map(function (x) {
    return '<div class="post"><div class="p-meta"><span class="p-name">' + RC.util.esc(x.name) + '</span>' +
      '<span>' + RC.util.esc(x.role || '客') + '</span><span class="mono">' + RC.util.esc(x.time || '') + '</span></div>' +
      '<div class="p-body">' + RC.util.esc(x.body) + '</div></div>';
  }).join('');
}
render();

document.getElementById('btnPost').addEventListener('click', function () {
  var name = document.getElementById('pName').value.trim() || '匿名';
  var body = document.getElementById('pBody').value.trim();
  var msg = document.getElementById('postMsg');
  if (!body) { msg.innerHTML = '<span class="red">※ 至少写一个字。</span>'; return; }
  var p = load();
  p.push({ name: name, role: '客', body: body, time: new Date().toLocaleString('zh-CN') });
  RC.store.set('bbs', p);
  document.getElementById('pBody').value = '';
  msg.innerHTML = '<span class="amber">※ 发出去了。岩夫朝你点了点头。</span>';
  render();
});
</script>
</body>
</html>
