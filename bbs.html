<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADIO CLUB｜树洞</title>
<meta name="description" content="RADIO CLUB 的树洞。不用留名字，写完投进去，会有人回你。">
<link rel="stylesheet" href="assets/css/club.css">
</head>
<body>
<div id="app">

  <header class="site-head slim">
    <div class="slim-bar">
      <a class="logo-sm" href="index.html">RADIO <b>CLUB</b></a>
      <span class="logo-sub-sm">
        <span class="i18n-cn">网络酒吧／梦侦探事务所</span>
        <span class="i18n-jp">ネット上のバー／夢探偵事務所</span>
      </span>
      <span class="open-lamp-sm"><span class="lamp"></span>
        <span class="i18n-cn">营业中</span><span class="i18n-jp">営業中</span>
      </span>
    </div>
    <div id="navMount"></div>
  </header>

  <div class="wrap">

    <div class="panel">
      <div class="p-head">
        <h2><span class="i18n-cn">树洞</span><span class="i18n-jp">木の穴</span></h2>
        <span class="p-en">HOLE</span>
        <span class="p-note">
          <span class="i18n-cn" data-i18n="holeSub"></span>
          <span class="i18n-jp" data-i18n="holeSub"></span>
        </span>
      </div>
      <div class="p-body">

        <div class="th-mouth" id="thMouth">
          <div class="th-mouth-in">
            <img src="assets/img/mirror-hole.jpg" alt="">
            <div class="th-veil"></div>
          </div>
        </div>
        <p class="hint center">
          <span class="i18n-cn" data-i18n="holeRule"></span>
          <span class="i18n-jp" data-i18n="holeRule"></span>
        </p>
        <p class="center small dim">
          <span class="i18n-cn" data-i18n="yourCode"></span>
          <span class="i18n-jp" data-i18n="yourCode"></span>
          ／ <b class="amber mono" id="thCode"></b>
        </p>

        <hr class="rule dbl">

        <label class="f" data-i18n="writeNote"></label>
        <textarea id="thBody" rows="3" maxlength="140"
          placeholder="今夜想说、又说不出口的那句"></textarea>
        <div class="th-meta">
          <input type="text" id="thSig" maxlength="16" placeholder="署名（可留空）">
          <span class="mono dim" id="thCount">0 / 140</span>
        </div>

        <div class="th-row">
          <span class="f" data-i18n="moodLabel"></span>
          <span id="thMoods" class="chips"></span>
        </div>

        <div class="center">
          <button type="button" class="btn" id="thDrop" data-i18n="drop"></button>
        </div>
        <div class="hint center" id="thMsg"></div>

        <hr class="rule">

        <div class="th-bar">
          <span id="thFilter" class="chips"></span>
          <span id="thCloud" class="th-cloud"></span>
        </div>

        <div id="thNotes" class="th-notes"></div>

      </div>
    </div>

  </div>

<div id="footMount"></div>

</div>

<script src="assets/js/store.js?v=2"></script>
<script src="assets/js/i18n.js?v=2"></script>
<script src="assets/js/ui.js?v=2"></script>
<script src="assets/js/haunt.js?v=2"></script>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/2.7.1/cloudbase.full.js"></script>
<script src="assets/js/treehole.js?v=2"></script>
<script>
RC.ui.chrome({ title: RC.i18n.t('bbs'), path: 'bbs.html' });
document.getElementById('navMount').innerHTML = RC.ui.nav('bbs.html');
document.getElementById('footMount').innerHTML = RC.ui.siteFoot({ active: 'bbs.html' });
</script>
</body>
</html>
