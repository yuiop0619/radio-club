<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADIO CLUB｜ご注文</title>
<link rel="stylesheet" href="assets/css/club.css">
</head>
<body data-amb-whisper>
<div id="app">

  <header class="site-head slim">
    <div class="slim-bar">
      <a class="logo-sm" href="index.html">RADIO <b>CLUB</b></a>
      <span class="logo-sub-sm">ネット上のバー／夢探偵事務所</span>
      <span class="open-lamp-sm"><span class="lamp"></span>営業中</span>
    </div>
    <div id="navMount"></div>
  </header>

  <div class="wrap">

    <div id="introMount"></div>

    <form id="orderForm" autocomplete="off">
      <div class="panel">
        <div class="p-head"><h2>ご用件承り</h2><span class="p-en">ORDER</span><span class="p-note">※ 帯 * 为必填</span></div>
        <div class="p-body">

          <div class="row">
            <div class="field">
              <label class="f">怎么称呼你 <span class="jp">／ハンドルネーム</span> <span class="req">*</span></label>
              <input type="text" id="fHandle" placeholder="真名或昵称都行">
            </div>
            <div class="field">
              <label class="f">年龄段 <span class="jp">／年代</span></label>
              <select id="fAge">
                <option value="">（不说也行）</option>
                <option>10代</option><option>20代</option><option>30代</option><option>40代</option><option>50代以上</option>
              </select>
            </div>
            <div class="field">
              <label class="f">生日 <span class="jp">／生年月日</span></label>
              <input type="date" id="fBirth">
              <div class="hint">用于数秘与本命牌，可留空</div>
            </div>
          </div>

          <div class="field">
            <label class="f">这件事属于哪一类 <span class="jp">／カテゴリ</span> <span class="req">*</span></label>
            <div class="radio-row" id="catRow">
              <span class="chip" data-v="人际关系">人际关系</span>
              <span class="chip" data-v="工作">工作</span>
              <span class="chip" data-v="恋爱">恋爱</span>
              <span class="chip" data-v="丧失">丧失／离别</span>
              <span class="chip" data-v="记忆">记忆／遗忘</span>
              <span class="chip" data-v="自我">自我／身份</span>
              <span class="chip" data-v="其他">其他</span>
            </div>
          </div>

          <div class="field">
            <label class="f">把这件事讲给我听 <span class="jp">／ご用件</span> <span class="req">*</span></label>
            <textarea id="fStory" placeholder="想到什么写什么，不用组织语言。越乱越好，乱的地方就是线头。"></textarea>
            <div class="hint" id="storyHint">至少写一句话。她真的会逐字读。</div>
          </div>

          <div class="field">
            <label class="f">最近反复做的梦 <span class="jp">／夢</span></label>
            <textarea id="fDream" style="min-height:64px" placeholder="片段也可以。记不清就写记不清。"></textarea>
          </div>

          <div class="row">
            <div class="field">
              <label class="f">做梦的频率 <span class="jp">／頻度</span></label>
              <div class="radio-row" id="freqRow">
                <span class="chip" data-v="每夜">每夜</span>
                <span class="chip" data-v="每周数次">每周数次</span>
                <span class="chip" data-v="偶尔">偶尔</span>
                <span class="chip" data-v="几乎不做">几乎不做</span>
              </div>
            </div>
            <div class="field">
              <label class="f">是否有过"醒着但动不了"的经历 <span class="jp">／金縛り</span></label>
              <div class="radio-row" id="parRow">
                <span class="chip" data-v="1">有过</span>
                <span class="chip" data-v="0">没有</span>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="f">最近反复想起的一句话或一个画面 <span class="jp">／反復</span></label>
            <input type="text" id="fRecurring" placeholder="例如：某人说过的某句话 / 某个走廊 / 某扇关不上的门">
          </div>

          <div class="center mt">
            <button type="submit" class="btn red">吧台に渡す ／ 交给吧台</button>
            <button type="button" class="btn ghost" id="btnClear">書き直す ／ 重写</button>
          </div>
          <div class="hint center" id="formMsg"></div>

        </div>
      </div>
    </form>

    <div id="doneMount" class="hidden"></div>

  </div>

  <footer class="site-foot">
    <span class="f-links"><a href="index.html">カウンター</a> │ <a href="tarot.html">タロット</a> │ <a href="psyche.html">精神分析</a></span>
    <span class="copy">© 2006- RADIO CLUB ／ ネット上のバー</span>
  </footer>

</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/tarot-data.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/haunt.js"></script>
<script>
RC.ui.chrome({ title: 'ご注文', path: 'order.html' });
document.getElementById('navMount').innerHTML = RC.ui.nav('order.html');

RC.ui.dialog({
  who: 'サフラン', jp: '夢探偵',
  mount: document.getElementById('introMount'),
  text: '点单不用写得漂亮。你负责把事实倒出来，我负责把它们摆整齐。写不下去的地方就空着——空着本身也是信息。',
  speed: 26
});

// 单选 chips
function bindChips(rowId, target) {
  var row = document.getElementById(rowId);
  var state = { v: '' };
  row.addEventListener('click', function (e) {
    var c = e.target.closest('.chip'); if (!c) return;
    row.querySelectorAll('.chip').forEach(function (x) { x.classList.remove('on'); });
    c.classList.add('on');
    state.v = c.getAttribute('data-v');
    target.set(state.v);
  });
  return state;
}
var sel = { category: '', dreamFreq: '', paralysis: '' };
var setCat = function (v) { sel.category = v; };
var setFreq = function (v) { sel.dreamFreq = v; };
var setPar = function (v) { sel.paralysis = v === '1'; };
bindChips('catRow', { set: setCat });
bindChips('freqRow', { set: setFreq });
bindChips('parRow', { set: setPar });

// 回填已有档案
var c0 = RC.case.get();
if (c0.handle) document.getElementById('fHandle').value = c0.handle;
if (c0.age) document.getElementById('fAge').value = c0.age;
if (c0.birth) document.getElementById('fBirth').value = c0.birth;
if (c0.story) document.getElementById('fStory').value = c0.story;
if (c0.dream) document.getElementById('fDream').value = c0.dream;
if (c0.recurring) document.getElementById('fRecurring').value = c0.recurring;

document.getElementById('btnClear').addEventListener('click', function () {
  document.getElementById('orderForm').reset();
  document.querySelectorAll('.chip.on').forEach(function (x) { x.classList.remove('on'); });
  sel.category = sel.dreamFreq = ''; sel.paralysis = '';
  document.getElementById('formMsg').textContent = '';
});

document.getElementById('orderForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var msg = document.getElementById('formMsg');
  var handle = document.getElementById('fHandle').value.trim();
  var story = document.getElementById('fStory').value.trim();
  if (!handle) { msg.innerHTML = '<span class="red">※ 总得让我知道怎么称呼你。</span>'; return; }
  if (!sel.category) { msg.innerHTML = '<span class="red">※ 选一个类别，哪怕选"其他"。</span>'; return; }
  if (story.length < 8) { msg.innerHTML = '<span class="red">※ 再多写一点。一句话也行，但得是一句完整的话。</span>'; return; }

  RC.case.save({
    handle: handle,
    age: document.getElementById('fAge').value,
    birth: document.getElementById('fBirth').value,
    category: sel.category,
    story: story,
    dream: document.getElementById('fDream').value.trim(),
    dreamFreq: sel.dreamFreq,
    paralysis: !!sel.paralysis,
    recurring: document.getElementById('fRecurring').value.trim()
  });

  document.getElementById('orderForm').classList.add('hidden');
  var done = document.getElementById('doneMount');
  done.classList.remove('hidden');
  RC.ui.dialog({
    who: 'サフラン', jp: '夢探偵', mount: done,
    text: '收到了，' + handle + '。我先读完，你别急。……读完了。下一步，去抽牌。牌会替你说那些你还没准备好亲口说的部分。',
    speed: 26,
    done: function () {
      done.insertAdjacentHTML('beforeend',
        '<div class="center mt"><a class="btn" href="tarot.html">タロットへ ／ 去抽牌 →</a> ' +
        '<a class="btn ghost" href="psyche.html">精神分析へ ／ 先做分析 →</a></div>');
    }
  });
});
</script>
</body>
</html>
