<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADIO CLUB｜塔罗</title>
<link rel="stylesheet" href="assets/css/club.css">
<!-- Open Graph / Twitter Card -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="RADIO CLUB">
<meta property="og:locale" content="zh_CN">
<meta property="og:locale:alternate" content="ja_JP">
<meta property="og:title" content="塔罗展开 · RADIO CLUB">
<meta property="og:description" content="22 张大阿卡纳，三种牌阵：每日一牌、时间线、五张解读。把没说出口的部分摆上桌。">
<meta property="og:url" content="https://leterhong.github.io/radio-club/tarot.html">
<meta property="og:image" content="https://leterhong.github.io/radio-club/assets/img/og-cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="塔罗展开 · RADIO CLUB">
<meta name="twitter:description" content="22 张大阿卡纳，三种牌阵：每日一牌、时间线、五张解读。把没说出口的部分摆上桌。">
<meta name="twitter:image" content="https://leterhong.github.io/radio-club/assets/img/og-cover.jpg">
</head>
<body data-amb-whisper>
<div class="site">
<div id="app">

  <header class="site-head slim">
    <div class="slim-bar">
      <a class="logo-sm" href="index.html">RADIO <b>CLUB</b></a>
      <span class="logo-sub-sm">
        <span class="i18n-cn">网络酒吧／梦侦探事务所</span>
        <span class="i18n-jp">ネット上のバー／夢探偵事務所</span>
      </span>
      <span class="open-lamp-sm"><span class="lamp"></span>
        <span class="i18n-cn">营业中</span><span class="i18n-jp">営業中</span>
      </span>
    </div>
    <div id="navMount"></div>
  </header>

  <div class="wrap">

    <div id="introMount"></div>

    <div class="panel">
      <div class="p-head">
        <h2><span class="i18n-cn">塔罗展开</span><span class="i18n-jp">タロット展開</span></h2>
        <span class="p-en">TAROT</span>
      </div>
      <div class="p-body">
        <!-- D1 · 咨询问题（先选问题，再抽牌） -->
        <div class="spread-bar consult-bar">
          <span class="sb-label"><span class="i18n-cn">咨询问题</span><span class="i18n-jp">相談ごと</span>：</span>
          <span id="domainBtns"></span>
        </div>
        <div class="spread-hint center" id="consultHint"></div>

        <!-- D2 · 三种牌阵选择器 -->
        <div class="spread-bar">
          <span class="sb-label"><span data-i18n="pickSpread">选阵型</span>：</span>
          <button type="button" class="sb-btn" data-spread="dailyCard" data-i18n="dailyCard">每日一牌</button>
          <button type="button" class="sb-btn" data-spread="timeLine"  data-i18n="timeLine">时间线</button>
          <button type="button" class="sb-btn on" data-spread="pentagram" data-i18n="pentagram">五张解读</button>
        </div>
        <div class="spread-hint center" id="spreadHint"></div>

        <div class="center mb">
          <button type="button" class="btn" id="btnDeal" data-i18n="deal">洗牌并抽牌</button>
          <button type="button" class="btn ghost" id="btnFlipAll" data-i18n="flipAll">全部翻开</button>
        </div>
        <div class="spread" id="spread"></div>
        <div class="hint center" id="dealHint" data-i18n="dealHint">点「洗牌并抽牌」，然后一张张点开。慢慢来，翻牌的速度也是信息。</div>
      </div>
    </div>

    <div class="panel hidden" id="readPanel">
      <div class="p-head">
        <h2><span class="i18n-cn">读牌</span><span class="i18n-jp">読牌</span></h2>
        <span class="p-en">READING</span>
      </div>
      <div class="p-body">
        <table class="grid" id="readTable"></table>
        <div id="synthMount"></div>
        <div class="center mt" id="elementBarMount"></div>
        <div class="center mt">
          <a class="btn" href="psyche.html" data-i18n="toPsyche">去做分析 →</a>
          <a class="btn ghost" href="verdict.html" data-i18n="toVerdict">领取鉴定书 →</a>
        </div>
      </div>
    </div>

  </div>

<div id="footMount"></div>

</div>
</div><!-- /.site -->

</body>
</html>
